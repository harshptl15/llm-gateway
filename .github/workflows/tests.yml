name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Same images as docker-compose.yml, run as sidecar containers for the job.
    # Tests hit real Postgres+pgvector and Redis; only the LLM provider is faked,
    # so CI never needs an Anthropic key.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      # One test loads the real MiniLM model (~90MB); cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Apply schema
        run: psql postgresql://gateway:gateway@localhost:5432/gateway -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Run tests
        run: pytest -q
